# RealtyNow Netlify CDN configuration
#
# This IS the CDN layer: Netlify's edge serves assets from their global PoPs
# with these Cache-Control headers. The build emits immutable-hashed files into
# /assets (see vite.config.ts assetsDir), so we can safely cache them forever —
# a deploy produces new hashes, which naturally invalidates stale references
# (no manual purge needed for hashed assets).

[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: all routes serve index.html (keeps /public/_redirects as the
# runtime rewrite; this is the Netlify-native equivalent).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# ── Cache headers ──────────────────────────────────────────────────────────
# index.html must revalidate on every request so a deploy's new asset hashes
# are picked up immediately (prevents "Failed to fetch dynamically imported
# module" from stale chunk references).
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Hashed build assets (JS/CSS) are immutable — cache for 1 year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Optimized images generated by scripts/optimize-images.mjs.
[[headers]]
  for = "/optimized/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Non-hashed static images / fonts — long but revalidatable cache.
[[headers]]
  for = "/*.(png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|mp4|webm)"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Security headers at the CDN edge.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
