<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 70" width="100%" height="100%">
  <g transform="translate(8, 12)">
    <!-- Colorful blocks -->
    <g transform="translate(2, 2)">
      <!-- Orange column -->
      <rect x="0" y="8" width="6" height="12" fill="#f59e0b" rx="0.5"/>
      <rect x="0" y="22" width="6" height="12" fill="#d97706" rx="0.5"/>
      <!-- Red column -->
      <rect x="8" y="0" width="6" height="16" fill="#ef4444" rx="0.5"/>
      <rect x="8" y="18" width="6" height="16" fill="#b91c1c" rx="0.5"/>
      <!-- Green column -->
      <rect x="16" y="6" width="6" height="14" fill="#84cc16" rx="0.5"/>
      <rect x="16" y="22" width="6" height="12" fill="#65a30d" rx="0.5"/>
      <!-- Teal column -->
      <rect x="24" y="12" width="6" height="10" fill="#06b6d4" rx="0.5"/>
      <rect x="24" y="24" width="6" height="10" fill="#0891b2" rx="0.5"/>
    </g>
    
    <!-- SUMADHURA text -->
    <text x="42" y="24" font-family="'Arial Black', 'Trebuchet MS', sans-serif" font-size="16" font-weight="900" fill="#1c1917" letter-spacing="0.5">SUMADHURA</text>
    <text x="180" y="16" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#78716c">™</text>
    <text x="43" y="34" font-family="Arial, sans-serif" font-size="7" font-weight="600" fill="#78716c" letter-spacing="0.5">foundation of happiness</text>
  </g>
</svg>
