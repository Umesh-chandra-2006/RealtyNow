# RealtyNow SPA nginx config.
#
# Mirrors the immutable-cache strategy already defined in public/.htaccess and
# netlify.toml so containerized deployments behave identically:
#   - index.html: never cached (must revalidate each deploy)
#   - hashed /assets/* : immutable, cache forever
#   - optimized images: immutable, cache forever

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Gzip static assets
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed build assets — immutable (safe to cache forever, hashes rotate per deploy).
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Build-time optimized images — immutable.
  location /optimized/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html — never cache so new asset hashes are picked up immediately.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # SPA fallback: every route serves index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Security headers.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
}
