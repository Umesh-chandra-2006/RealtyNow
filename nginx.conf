# RealtyNow SPA nginx config — main (non-root) configuration.
#
# This is the PRIMARY nginx config (COPY'd to /etc/nginx/nginx.conf) for a
# container that runs as NON-ROOT (Dockerfile USER 101:101) with a
# read-only root filesystem. It therefore:
#   * listens on 8080 (unprivileged port),
#   * writes pid + temp/buffer paths under /tmp (writable at runtime),
#   * logs to stderr (no root-fs writes needed).
#
# It mirrors the immutable-cache strategy in public/.htaccess and netlify.toml:
#   - index.html: never cached (revalidate each deploy)
#   - hashed /assets/* : immutable, cache forever
#   - optimized images: immutable, cache forever

# Non-root master runs as the container's USER (101); nginx worker inherits it.
user nginx;

# Writable runtime paths (root fs is read-only; /tmp is a pod emptyDir).
pid /tmp/nginx.pid;
client_body_temp_path /tmp/nginx_client_temp;
proxy_temp_path /tmp/nginx_proxy_temp;
fastcgi_temp_path /tmp/nginx_fastcgi_temp;
uwsgi_temp_path /tmp/nginx_uwsgi_temp;
scgi_temp_path /tmp/nginx_scgi_temp;

error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Write access logs to stdout (container log collector) instead of the
  # compiled-in /var/log/nginx/access.log — the root filesystem is read-only,
  # so a file-based access log would fail on the first request (nginx 500).
  access_log /dev/stdout;

  # Do not expose the nginx version.
  server_tokens off;

  # Forwarded headers if/when behind an LB/ingress.
  real_ip_header X-Forwarded-For;
  set_real_ip_from 0.0.0.0/0;

  # Gzip static assets.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Hashed build assets — immutable.
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # Build-time optimized images — immutable.
    location /optimized/ {
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # index.html — never cache so new asset hashes are picked up immediately.
    location = /index.html {
      add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback — every route serves index.html.
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }
}
