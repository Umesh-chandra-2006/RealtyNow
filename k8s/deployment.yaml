# RealtyNow SPA — stateless nginx Deployment.
#
# The web image serves the static bundle only (no local state), so it scales
# horizontally behind the Service and the HorizontalPodAutoscaler. Supabase
# (DB + edge functions) + Razorpay are external SaaS; no cluster state lives here.
#
# The .env files are NOT baked into the image: browser credentials (VITE_*)
# are injected at request time via front-end env only if you use runtime config;
# otherwise the image is fully static and needs nothing at runtime. For any
# server-side needs, configure via secrets/env, never in the committed image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtynow
  namespace: realtynow
  labels:
    app: realtynow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: realtynow
  template:
    metadata:
      labels:
        app: realtynow
    spec:
      containers:
        - name: realtynow
          # Overwritten at deploy time by CI (kubectl set image ...:tag).
          image: ghcr.io/REPLACE_ORG/realtynow:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          # Mirror the Dockerfile HEALTHCHECK so k8s probes match the container.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
