# RealtyNow SPA — stateless nginx Deployment.
#
# The web image serves the static bundle only (no local state), so it scales
# horizontally behind the Service and the HorizontalPodAutoscaler. Supabase
# (DB + edge functions) + Razorpay are external SaaS; no cluster state lives here.
#
# Runtime is locked to a NON-ROOT user (uid 101) on port 8080 with a read-only
# root filesystem and all capabilities dropped — matching the hardened Dockerfile.
# A writable emptyDir is mounted at /tmp where nginx writes its pid/temp files.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtynow
  namespace: realtynow
  labels:
    app: realtynow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: realtynow
  template:
    metadata:
      labels:
        app: realtynow
    spec:
      containers:
        - name: realtynow
          # Overwritten at deploy time by CI (kubectl set image ...:tag).
          image: ghcr.io/REPLACE_ORG/realtynow:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # Writable scratch for nginx pid/temp (root fs is read-only, non-root).
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # Mirror the Dockerfile HEALTHCHECK so k8s probes match the container.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            # Must match the non-root nginx image (uid/guid 101, port 8080).
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
