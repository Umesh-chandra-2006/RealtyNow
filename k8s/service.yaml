# Internal ClusterIP Service fronting the web Deployment.
# An ingress/LB terminates TLS and routes to this Service (port 80).
apiVersion: v1
kind: Service
metadata:
  name: realtynow
  namespace: realtynow
  labels:
    app: realtynow
spec:
  type: ClusterIP
  selector:
    app: realtynow
  ports:
    - name: http
      port: 80
      targetPort: http
