# Kustomize base for the RealtyNow web tier.
#
#   kubectl apply -k k8s/
#
# CI (release.yml) overrides the image tag at deploy time with `kubectl set image`
# so the committed image reference is a placeholder only.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: realtynow
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
